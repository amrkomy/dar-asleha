<body>
    <!-- نفس هيكل HTML السابق -->
    <header>
        <div class="logo">
            <i class="fas fa-headset"></i> 
            <span>نظام إدارة الشكاوى</span>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <button id="installButton" class="install-btn" style="display: none;">
                <i class="fas fa-download"></i> تثبيت التطبيق
            </button>
            <div class="admin-info">
                <div class="admin-avatar">AD</div>
                <span>مسؤول النظام</span>
            </div>
        </div>
    </header>
    <div class="container">
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-title"><i class="fas fa-list"></i> إجمالي الشكاوى</div>
                <div class="stat-number" id="total-complaints">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i class="fas fa-clock"></i> قيد المعالجة</div>
                <div class="stat-number" id="pending-complaints">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i class="fas fa-check-circle"></i> تم الحل</div>
                <div class="stat-number" id="resolved-complaints">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i class="fas fa-times-circle"></i> مرفوضة</div>
                <div class="stat-number" id="rejected-complaints">0</div>
            </div>
        </div>
        <div class="card">
            <h2><i class="fas fa-list-alt"></i> إدارة الشكاوى</h2>
            <div class="filters">
                <div class="filter-group">
                    <label for="status-filter">تصفية حسب الحالة</label>
                    <select id="status-filter">
                        <option value="all">جميع الحالات</option>
                        <option value="pending">قيد المعالجة</option>
                        <option value="resolved">تم الحل</option>
                        <option value="rejected">مرفوضة</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="search">بحث في الشكاوى</label>
                    <input type="text" id="search" placeholder="ابحث بالاسم أو رقم الهاتف...">
                </div>
            </div>
            <div id="complaints-list" class="complaints-list">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <h3>لا توجد شكاوى لعرضها</h3>
                    <p>سيتم عرض الشكاوى هنا عند توفرها</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- نموذج عرض الشكوى -->
    <div id="complaint-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2><i class="fas fa-eye"></i> معاينة الشكوى</h2>
            </div>
            <div class="modal-body">
                <div class="complaint-detail">
                    <div class="detail-row">
                        <div class="detail-label">رقم الشكوى:</div>
                        <div class="detail-value" id="modal-id">-</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">الاسم:</div>
                        <div class="detail-value" id="modal-name">-</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">رقم الهاتف:</div>
                        <div class="detail-value" id="modal-phone">-</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">حالة الشكوى:</div>
                        <div class="detail-value">
                            <span class="status-badge" id="modal-status">-</span>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">التقييم:</div>
                        <div class="detail-value" id="modal-rating">
                            <div class="rating-stars" id="rating-stars">
                                <!-- النجوم سيتم إضافتها ديناميكيًا -->
                            </div>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">تفاصيل الشكوى:</div>
                        <div class="detail-value" id="modal-complaint">-</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">تاريخ الإضافة:</div>
                        <div class="detail-value" id="modal-created-at">-</div>
                    </div>
                </div>
                <div class="status-update">
                    <h3><i class="fas fa-edit"></i> تحديث حالة الشكوى</h3>
                    <div class="status-selector">
                        <button class="status-btn status-btn-pending" data-status="pending">
                            <i class="fas fa-clock"></i> قيد المعالجة
                        </button>
                        <button class="status-btn status-btn-resolved" data-status="resolved">
                            <i class="fas fa-check-circle"></i> تم الحل
                        </button>
                        <button class="status-btn status-btn-rejected" data-status="rejected">
                            <i class="fas fa-times-circle"></i> مرفوضة
                        </button>
                    </div>
                </div>
                <div class="comments-section">
                    <h3><i class="fas fa-comments"></i> التعليقات</h3>
                    <div id="comments-list" class="comments-list">
                        <!-- التعليقات ستظهر هنا -->
                    </div>
                    <div class="comment-form">
                        <textarea id="comment-input" class="comment-input" placeholder="أضف تعليقًا هنا..."></textarea>
                        <button id="add-comment-btn" class="comment-submit-btn">
                            <i class="fas fa-plus"></i> إضافة تعليق
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn" id="close-modal-btn" style="background: linear-gradient(135deg, #6c757d, #495057); color: white;">
                    <i class="fas fa-times"></i> إغلاق
                </button>
                <button class="btn btn-edit" id="save-status-btn">
                    <i class="fas fa-save"></i> حفظ التغييرات
                </button>
            </div>
        </div>
    </div>
    
    <!-- حاوية الإشعارات -->
    <div id="toast-container" class="toast-container"></div>
    
    <script>
        // ===================== تهيئة التطبيق =====================
        
        // 1. تهيئة Supabase بشكل صحيح - استخدم المتغير الموجود بالفعل
        // ❌ لا تعيد تعريف supabase - تم تعريفه بالفعل من خلال السكريبت الخارجي
        
        // 2. عناصر DOM
        const complaintsList = document.getElementById('complaints-list');
        const complaintModal = document.getElementById('complaint-modal');
        const closeModalBtn = document.querySelector('.close-modal');
        const closeModalBtn2 = document.getElementById('close-modal-btn');
        const statusFilter = document.getElementById('status-filter');
        const searchInput = document.getElementById('search');
        const toastContainer = document.getElementById('toast-container');
        const saveStatusBtn = document.getElementById('save-status-btn');
        const statusButtons = document.querySelectorAll('.status-btn');
        const commentInput = document.getElementById('comment-input');
        const addCommentBtn = document.getElementById('add-comment-btn');
        const commentsList = document.getElementById('comments-list');
        const installButton = document.getElementById('installButton');
        
        // 3. إحصائيات
        const totalComplaints = document.getElementById('total-complaints');
        const pendingComplaints = document.getElementById('pending-complaints');
        const resolvedComplaints = document.getElementById('resolved-complaints');
        const rejectedComplaints = document.getElementById('rejected-complaints');
        
        // 4. متغيرات التطبيق
        let complaints = [];
        let currentComplaintId = null;
        let currentComplaintStatus = null;
        let selectedStatus = null;
        let lastComplaintIds = new Set();
        let deferredPrompt = null;
        let realtimeChannel = null;
        
        // ===================== وظائف Supabase =====================
        
        // تحميل الشكاوى من Supabase
        async function loadComplaints() {
            try {
                // التحقق من أن supabase مهيأ
                if (!window.supabase || typeof window.supabase.from !== 'function') {
                    throw new Error('Supabase غير مهيأ بشكل صحيح');
                }
                
                // استخدام supabase من النافذة (window)
                let query = window.supabase
                    .from('complaints')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                const status = statusFilter.value;
                if (status !== 'all') {
                    query = query.eq('status', status);
                }
                
                const searchTerm = searchInput.value.trim();
                if (searchTerm) {
                    query = query.or(`name.ilike.%${searchTerm}%,phone.ilike.%${searchTerm}%`);
                }
                
                const { data, error } = await query;
                
                if (error) {
                    console.error('Error loading complaints:', error);
                    showToast('حدث خطأ في تحميل الشكاوى', 'error');
                    return;
                }
                
                complaints = data || [];
                renderComplaints();
                updateStats();
                checkForNewComplaints();
                
            } catch (error) {
                console.error('Error loading complaints:', error);
                showToast('حدث خطأ في تحميل الشكاوى: ' + error.message, 'error');
            }
        }
        
        // تحديث حالة الشكوى
        async function updateComplaintStatus() {
            if (!currentComplaintId || !selectedStatus) return;
            
            try {
                const { error } = await window.supabase
                    .from('complaints')
                    .update({ 
                        status: selectedStatus,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', currentComplaintId);
                    
                if (error) {
                    console.error('Error updating complaint status:', error);
                    showToast('حدث خطأ أثناء تحديث حالة الشكوى', 'error');
                    return;
                }
                
                showToast('تم تحديث حالة الشكوى بنجاح', 'success');
                complaintModal.style.display = 'none';
                loadComplaints();
                
            } catch (error) {
                console.error('Error updating complaint status:', error);
                showToast('حدث خطأ أثناء تحديث حالة الشكوى', 'error');
            }
        }
        
        // إضافة تعليق جديد
        async function addComment() {
            if (!currentComplaintId || !commentInput.value.trim()) {
                showToast('يرجى كتابة تعليق أولاً', 'error');
                return;
            }
            
            try {
                const commentText = commentInput.value.trim();
                addCommentBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإضافة...';
                addCommentBtn.disabled = true;
                
                const { data: complaintData, error: fetchError } = await window.supabase
                    .from('complaints')
                    .select('admin_comment')
                    .eq('id', currentComplaintId)
                    .single();
                    
                if (fetchError) {
                    console.error('Error fetching current comment:', fetchError);
                    showToast('حدث خطأ أثناء جلب التعليق الحالي', 'error');
                    addCommentBtn.innerHTML = '<i class="fas fa-plus"></i> إضافة تعليق';
                    addCommentBtn.disabled = false;
                    return;
                }
                
                const now = new Date();
                const dateTime = now.toLocaleString('ar-EG');
                const newComment = `[${dateTime}] مسؤول النظام: ${commentText}\n${complaintData.admin_comment || ''}`;
                
                const { error } = await window.supabase
                    .from('complaints')
                    .update({ 
                        admin_comment: newComment,
                        updated_at: new Date().toISOString(),
                        has_new_response: true
                    })
                    .eq('id', currentComplaintId);
                    
                if (error) {
                    console.error('Error updating comment:', error);
                    showToast('حدث خطأ أثناء إضافة التعليق: ' + error.message, 'error');
                    addCommentBtn.innerHTML = '<i class="fas fa-plus"></i> إضافة تعليق';
                    addCommentBtn.disabled = false;
                    return;
                }
                
                showToast('تم إضافة التعليق بنجاح', 'success');
                commentInput.value = '';
                addCommentBtn.innerHTML = '<i class="fas fa-plus"></i> إضافة تعليق';
                addCommentBtn.disabled = false;
                await loadComments();
                
            } catch (error) {
                console.error('Error adding comment:', error);
                showToast('حدث خطأ غير متوقع أثناء إضافة التعليق', 'error');
                addCommentBtn.innerHTML = '<i class="fas fa-plus"></i> إضافة تعليق';
                addCommentBtn.disabled = false;
            }
        }
        
        // تحميل التعليقات
        async function loadComments() {
            if (!currentComplaintId) return;
            
            try {
                const { data, error } = await window.supabase
                    .from('complaints')
                    .select('admin_comment')
                    .eq('id', currentComplaintId)
                    .single();
                    
                if (error) {
                    console.error('Error loading comments:', error);
                    commentsList.innerHTML = '<p class="no-comments">حدث خطأ في تحميل التعليقات</p>';
                    return;
                }
                
                commentsList.innerHTML = '';
                
                if (data && data.admin_comment) {
                    const comments = data.admin_comment.split('\n').filter(comment => comment.trim() !== '');
                    
                    if (comments.length > 0) {
                        comments.forEach(comment => {
                            const commentItem = document.createElement('div');
                            commentItem.className = 'comment-item';
                            
                            if (comment.includes(']')) {
                                const parts = comment.split(']');
                                const timestamp = parts[0].replace('[', '');
                                const commentText = parts.slice(1).join(']').trim();
                                commentItem.innerHTML = `
                                    <div class="comment-header">
                                        <span>${timestamp}</span>
                                    </div>
                                    <div>${commentText}</div>
                                `;
                            } else {
                                commentItem.innerHTML = `
                                    <div class="comment-header">
                                        <span>تعليق قديم</span>
                                    </div>
                                    <div>${comment}</div>
                                `;
                            }
                            commentsList.appendChild(commentItem);
                        });
                    } else {
                        commentsList.innerHTML = '<p class="no-comments">لا توجد تعليقات حتى الآن</p>';
                    }
                } else {
                    commentsList.innerHTML = '<p class="no-comments">لا توجد تعليقات حتى الآن</p>';
                }
            } catch (error) {
                console.error('Error loading comments:', error);
                commentsList.innerHTML = '<p class="no-comments">حدث خطأ غير متوقع في تحميل التعليقات</p>';
            }
        }
        
        // ===================== Realtime Listener =====================
        
        function startRealtimeListener() {
            if (!window.supabase || typeof window.supabase.channel !== 'function') {
                console.warn('Supabase realtime غير متاح');
                return;
            }
            
            try {
                console.log('🚀 بدء الاستماع للتحديثات المباشرة...');
                
                realtimeChannel = window.supabase
                    .channel('complaints-realtime')
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'complaints'
                    }, async (payload) => {
                        console.log('✅ شكوى جديدة عبر Realtime:', payload.new);
                        const newComplaint = payload.new;
                        
                        // إشعار داخلي
                        showNewComplaintNotification(newComplaint);
                        
                        // تحديث القائمة تلقائياً
                        loadComplaints();
                        
                        // ✅ إرسال إشعار OneSignal عبر Edge Function
                        try {
                            console.log('📨 إرسال إشعار OneSignal عبر Edge Function...');
                            const response = await fetch('https://xqccuvhtrxhsrzqgktdj.supabase.co/functions/v1/onesignal-notify', {
                                method: 'POST',
                                headers: { 
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ complaint: newComplaint })
                            });
                            
                            if (!response.ok) {
                                const errorText = await response.text();
                                console.error('❌ فشل إرسال إشعار OneSignal:', response.status, errorText);
                            } else {
                                console.log('✅ إشعار OneSignal تم إرساله بنجاح');
                            }
                        } catch (error) {
                            console.error('💥 خطأ في إرسال الإشعار:', error);
                        }
                    })
                    .subscribe((status) => {
                        console.log('📡 حالة الاشتراك Realtime:', status);
                    });
                    
            } catch (error) {
                console.error('خطأ في بدء Realtime listener:', error);
            }
        }
        
        function stopRealtimeListener() {
            if (realtimeChannel && window.supabase) {
                window.supabase.removeChannel(realtimeChannel);
                console.log('⏹️ تم إيقاف Realtime listener');
            }
        }
        
        // ===================== وظائف الواجهة =====================
        
        // عرض الشكاوى في القائمة
        function renderComplaints() {
            if (complaints.length === 0) {
                complaintsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>لا توجد شكاوى لعرضها</h3>
                        <p>استخدم عوامل التصفية أو انتظر إضافة شكاوى جديدة</p>
                    </div>
                `;
                return;
            }
            
            complaintsList.innerHTML = '';
            
            complaints.forEach(complaint => {
                const statusClass = `status-${complaint.status}`;
                let statusText = 'قيد المعالجة';
                if (complaint.status === 'resolved') statusText = 'تم الحل';
                if (complaint.status === 'rejected') statusText = 'مرفوضة';
                
                const complaintDate = new Date(complaint.created_at).toLocaleDateString('ar-EG');
                const rating = complaint.rating || 0;
                
                let starsHtml = '';
                for (let i = 1; i <= 5; i++) {
                    starsHtml += `<i class="fas fa-star star ${i <= rating ? 'filled' : ''}"></i>`;
                }
                
                const complaintItem = document.createElement('div');
                complaintItem.className = 'complaint-item';
                complaintItem.innerHTML = `
                    <div class="complaint-info">
                        <div><strong>${complaint.name}</strong> - ${complaint.phone}</div>
                        <div class="complaint-text">${complaint.complaint}</div>
                        <div class="rating-stars">
                            ${starsHtml}
                        </div>
                        <div class="complaint-meta">
                            <span>رقم #${complaint.id}</span>
                            <span>${complaintDate}</span>
                        </div>
                    </div>
                    <div class="complaint-actions">
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        <button class="btn btn-view manage-btn" data-id="${complaint.id}">
                            <i class="fas fa-cog"></i> إدارة
                        </button>
                    </div>
                `;
                
                complaintsList.appendChild(complaintItem);
            });
            
            // إضافة مستمعي الأحداث للأزرار
            document.querySelectorAll('.manage-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const complaintId = btn.getAttribute('data-id');
                    openComplaintModal(complaintId);
                });
            });
        }
        
        // فتح نموذج معاينة الشكوى
        async function openComplaintModal(complaintId) {
            const complaint = complaints.find(c => c.id == complaintId);
            if (!complaint) return;
            
            currentComplaintId = complaintId;
            currentComplaintStatus = complaint.status;
            selectedStatus = complaint.status;
            
            // تعبئة البيانات في النموذج
            document.getElementById('modal-id').textContent = complaint.id;
            document.getElementById('modal-name').textContent = complaint.name;
            document.getElementById('modal-phone').textContent = complaint.phone;
            
            let statusText = 'قيد المعالجة';
            if (complaint.status === 'resolved') statusText = 'تم الحل';
            if (complaint.status === 'rejected') statusText = 'مرفوضة';
            
            const statusBadge = document.getElementById('modal-status');
            statusBadge.textContent = statusText;
            statusBadge.className = `status-badge status-${complaint.status}`;
            
            // النجوم
            const rating = complaint.rating || 0;
            const ratingStars = document.getElementById('rating-stars');
            ratingStars.innerHTML = '';
            
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('i');
                star.className = `fas fa-star star ${i <= rating ? 'filled' : ''}`;
                ratingStars.appendChild(star);
            }
            
            document.getElementById('modal-complaint').textContent = complaint.complaint;
            const complaintDate = new Date(complaint.created_at).toLocaleDateString('ar-EG');
            document.getElementById('modal-created-at').textContent = complaintDate;
            
            // تحديد الحالة النشطة
            statusButtons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-status') === complaint.status) {
                    btn.classList.add('active');
                }
            });
            
            // تحميل التعليقات
            await loadComments();
            
            // عرض النموذج
            complaintModal.style.display = 'block';
        }
        
        // تحديث الإحصائيات
        function updateStats() {
            totalComplaints.textContent = complaints.length;
            pendingComplaints.textContent = complaints.filter(c => c.status === 'pending').length;
            resolvedComplaints.textContent = complaints.filter(c => c.status === 'resolved').length;
            rejectedComplaints.textContent = complaints.filter(c => c.status === 'rejected').length;
        }
        
        // التحقق من وجود شكاوى جديدة
        function checkForNewComplaints() {
            const currentIds = new Set(complaints.map(c => c.id));
            
            if (lastComplaintIds.size === 0) {
                lastComplaintIds = currentIds;
                return;
            }
            
            const newComplaints = complaints.filter(complaint => !lastComplaintIds.has(complaint.id));
            
            if (newComplaints.length > 0) {
                newComplaints.forEach(complaint => {
                    showNewComplaintNotification(complaint);
                });
            }
            
            lastComplaintIds = currentIds;
        }
        
        // ===================== الإشعارات =====================
        
        // عرض إشعار شكوى جديدة
        function showNewComplaintNotification(complaint) {
            const toast = document.createElement('div');
            toast.className = 'toast new-complaint';
            const complaintDate = new Date(complaint.created_at).toLocaleDateString('ar-EG');
            
            toast.innerHTML = `
                <div style="display: flex; align-items: center; width: 100%;">
                    <i class="toast-icon fas fa-bell"></i>
                    <strong>تم إضافة شكوى جديدة</strong>
                </div>
                <div class="new-complaint-details">
                    <div><span class="label">الاسم:</span> ${complaint.name}</div>
                    <div><span class="label">الهاتف:</span> ${complaint.phone}</div>
                    <div><span class="label">التاريخ:</span> ${complaintDate}</div>
                    <div><span class="label">الشكوى:</span> ${complaint.complaint.substring(0, 50)}${complaint.complaint.length > 50 ? '...' : ''}</div>
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 5000);
        }
        
        // عرض الإشعارات العادية
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = 'fa-info-circle';
            if (type === 'success') icon = 'fa-check-circle';
            if (type === 'error') icon = 'fa-exclamation-circle';
            
            toast.innerHTML = `<i class="toast-icon fas ${icon}"></i>${message}`;
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 5000);
        }
        
        // ===================== PWA و Service Worker =====================
        
        // إعداد PWA
        function setupPWA() {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installButton.style.display = 'flex';
            });
            
            installButton.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                
                if (outcome === 'accepted') {
                    installButton.style.display = 'none';
                    showToast('تم بدء تثبيت التطبيق', 'success');
                }
                
                deferredPrompt = null;
            });
            
            window.addEventListener('appinstalled', () => {
                installButton.style.display = 'none';
                deferredPrompt = null;
                showToast('تم تثبيت التطبيق بنجاح', 'success');
            });
            
            if (window.matchMedia('(display-mode: standalone)').matches) {
                installButton.style.display = 'none';
            }
        }
        
        // تسجيل Service Worker
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registered with scope:', registration.scope);
                    })
                    .catch((error) => {
                        console.error('Service Worker registration failed:', error);
                    });
            }
        }
        
        // ===================== إعداد مستمعي الأحداث =====================
        
        function setupEventListeners() {
            // التصفية والبحث
            statusFilter.addEventListener('change', loadComplaints);
            searchInput.addEventListener('input', loadComplaints);
            
            // إغلاق النموذج
            closeModalBtn.addEventListener('click', () => {
                complaintModal.style.display = 'none';
            });
            
            closeModalBtn2.addEventListener('click', () => {
                complaintModal.style.display = 'none';
            });
            
            window.addEventListener('click', (event) => {
                if (event.target === complaintModal) {
                    complaintModal.style.display = 'none';
                }
            });
            
            // أزرار الحالة
            statusButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    statusButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedStatus = btn.getAttribute('data-status');
                });
            });
            
            // حفظ الحالة
            saveStatusBtn.addEventListener('click', updateComplaintStatus);
            
            // إضافة تعليق
            addCommentBtn.addEventListener('click', addComment);
            
            commentInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    addComment();
                }
            });
        }
        
        // ===================== تهيئة التطبيق الرئيسية =====================
        
        async function initApp() {
            console.log('🚀 بدء تهيئة التطبيق...');
            
            try {
                // 1. التحقق من Supabase
                if (!window.supabase || typeof window.supabase.from !== 'function') {
                    // محاولة تهيئة Supabase يدوياً إذا لم يكن موجوداً
                    const SUPABASE_URL = 'https://xqccuvhtrxhsrzqgktdj.supabase.co';
                    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxY2N1dmh0cnhoc3J6cWdrdGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU0MzI5MDMsImV4cCI6MjA3MTAwODkwM30.wDVE-gsAUgjmv82pYKoMMMeF3YRAgFVWg854G5YLpyE';
                    
                    window.supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    console.log('✅ Supabase تم تهيئته يدوياً');
                }
                
                // 2. إعداد مستمعي الأحداث
                setupEventListeners();
                
                // 3. تحميل الشكاوى الأولية
                await loadComplaints();
                
                // 4. بدء Realtime listener
                startRealtimeListener();
                
                // 5. تسجيل Service Worker
                registerServiceWorker();
                
                // 6. إعداد PWA
                setupPWA();
                
                console.log('✅ التطبيق مهيأ بالكامل وجاهز للاستخدام');
                showToast('تم تحميل لوحة التحكم بنجاح', 'success');
                
            } catch (error) {
                console.error('❌ فشل في تهيئة التطبيق:', error);
                
                showToast('حدث خطأ في تحميل التطبيق: ' + error.message, 'error');
                
                // عرض واجهة بديلة للخطأ
                document.getElementById('complaints-list').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>تعذر تحميل البيانات</h3>
                        <p>${error.message}</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">تأكد من اتصالك بالإنترنت وحاول مرة أخرى</p>
                        <button onclick="location.reload()" class="btn" style="margin-top: 1rem;">
                            <i class="fas fa-redo"></i> إعادة تحميل الصفحة
                        </button>
                    </div>
                `;
            }
        }
        
        // بدء التطبيق عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', initApp);
        
        // تنظيف الموارد عند إغلاق الصفحة
        window.addEventListener('beforeunload', () => {
            stopRealtimeListener();
        });
        
    </script>
